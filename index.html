<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Segnapunti multiplayer per Munchkin: livelli e bonus sincronizzati fra i telefoni del tavolo."
    />

    <title>Munchkin Tracker</title>

    <!-- Senza manifest il browser non propone "Aggiungi a schermata Home". -->
    <link rel="manifest" href="/manifest.webmanifest" />

    <meta name="theme-color" content="#241a12" />

    <!-- Le facce del gioco: gotica per i titoli, umanista per il testo,
         monospaziata per il codice partita che si detta a voce. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&family=Grenze+Gotisch:wght@700&family=Space+Mono:wght@700&display=swap"
    />

    <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml" />
    <link rel="alternate icon" href="/icons/icon-192.png" />

    <!-- iOS il manifest non lo legge: icona e modalità vanno nei suoi meta. -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png" />
    <meta name="apple-mobile-web-app-title" content="Munchkin" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
